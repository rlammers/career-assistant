name: Docker Image CI

on:
  push:
    branches: ["main"]
    paths:
      - 'src/backend/**'
      - 'src/frontend/**'
      - '.dockerignore'
      - '.github/workflows/docker-image.yml'
  pull_request:
    branches: ["main"]
    paths:
      - 'src/backend/**'
      - 'src/frontend/**'
      - '.dockerignore'
      - '.github/workflows/docker-image.yml'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect image changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Detect changed image inputs
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          base: ${{ github.ref }}
          filters: |
            backend:
              - 'src/backend/**'
              - '.dockerignore'
              - '.github/workflows/docker-image.yml'
            frontend:
              - 'src/frontend/**'
              - '.dockerignore'
              - '.github/workflows/docker-image.yml'

  build-images:
    name: Build changed Docker images
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Create excluded frontend environment sentinel
        if: needs.changes.outputs.frontend == 'true'
        shell: bash
        run: |
          printf '%s\n' \
            'VITE_ENTRA_REDIRECT_URI=http://localhost:5173/' \
            'VITE_BUILD_CONTEXT_SENTINEL=must-not-enter-the-image' \
            > src/frontend/.env.local
      - name: Build backend Docker image
        if: needs.changes.outputs.backend == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: src/backend/CareerAssistant.Api/Dockerfile
          load: true
          push: false
          tags: career-assistant-backend:ci
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=backend-image
          cache-to: type=gha,mode=max,scope=backend-image
      - name: Verify backend image provenance
        if: needs.changes.outputs.backend == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' career-assistant-backend:ci)" = "$GITHUB_SHA"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' career-assistant-backend:ci)" = "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
      - name: Build frontend Docker image
        if: needs.changes.outputs.frontend == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: src/frontend/Dockerfile
          load: true
          push: false
          tags: career-assistant-frontend:ci
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
            VITE_AUTH_ENABLED=true
            VITE_ENTRA_TENANT_ID=11111111-1111-1111-1111-111111111111
            VITE_ENTRA_SPA_CLIENT_ID=22222222-2222-2222-2222-222222222222
            VITE_ENTRA_API_SCOPE=api://33333333-3333-3333-3333-333333333333/access_as_user
          cache-from: type=gha,scope=frontend-image
          cache-to: type=gha,mode=max,scope=frontend-image
      - name: Verify frontend image inputs and provenance
        if: needs.changes.outputs.frontend == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if docker run --rm --entrypoint sh career-assistant-frontend:ci -c \
            "grep -R -F -q 'http://localhost:5173' /usr/share/nginx/html"; then
            echo "Frontend image contains a localhost redirect." >&2
            exit 1
          fi
          if docker run --rm --entrypoint sh career-assistant-frontend:ci -c \
            "grep -R -F -q 'must-not-enter-the-image' /usr/share/nginx/html"; then
            echo "Frontend image contains the build-context sentinel." >&2
            exit 1
          fi
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' career-assistant-frontend:ci)" = "$GITHUB_SHA"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' career-assistant-frontend:ci)" = "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
