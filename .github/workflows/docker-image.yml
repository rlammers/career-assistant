name: Docker Image CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/backend/**'
      - 'src/frontend/**'
      - '.dockerignore'
      - '.github/workflows/docker-image.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/backend/**'
      - 'src/frontend/**'
      - '.dockerignore'
      - '.github/workflows/docker-image.yml'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect image changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Detect changed image inputs
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          base: ${{ github.ref }}
          filters: |
            backend:
              - 'src/backend/**'
              - '.dockerignore'
              - '.github/workflows/docker-image.yml'
            frontend:
              - 'src/frontend/**'
              - '.dockerignore'
              - '.github/workflows/docker-image.yml'

  build-backend:
    name: Build backend image
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build backend Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: src/backend/CareerAssistant.Api/Dockerfile
          push: false
          tags: career-assistant-backend:ci
          cache-from: type=gha,scope=backend-image
          cache-to: type=gha,mode=max,scope=backend-image

  build-frontend:
    name: Build frontend image
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build frontend Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: src/frontend/Dockerfile
          push: false
          tags: career-assistant-frontend:ci
          build-args: |
            VITE_AUTH_ENABLED=true
            VITE_ENTRA_TENANT_ID=11111111-1111-1111-1111-111111111111
            VITE_ENTRA_SPA_CLIENT_ID=22222222-2222-2222-2222-222222222222
            VITE_ENTRA_API_SCOPE=api://33333333-3333-3333-3333-333333333333/access_as_user
          cache-from: type=gha,scope=frontend-image
          cache-to: type=gha,mode=max,scope=frontend-image
