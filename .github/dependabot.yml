version: 2

updates:
  - package-ecosystem: "nuget"
    directory: "/src/backend"
    schedule:
      interval: "quarterly"
    open-pull-requests-limit: 2
    groups:
      dotnet-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/src/frontend"
    schedule:
      interval: "quarterly"
    open-pull-requests-limit: 2
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "quarterly"
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/src/backend/CareerAssistant.Api"
    schedule:
      interval: "quarterly"
    open-pull-requests-limit: 2

  - package-ecosystem: "docker"
    directory: "/src/frontend"
    schedule:
      interval: "quarterly"
    open-pull-requests-limit: 2
